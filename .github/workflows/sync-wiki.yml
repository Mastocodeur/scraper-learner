name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**.md"
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du repo principal
        uses: actions/checkout@v4

      - name: Cloner le wiki
        run: |
          git clone https://x-access-token:${{ secrets.WIKI_TOKEN }}@github.com/Mastocodeur/scraper-learner.wiki.git wiki

      - name: Copier les fichiers Markdown vers le wiki
        run: |
          cp -r docs/. wiki/

      - name: Commiter et pusher vers le wiki
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.WIKI_TOKEN }}@github.com/Mastocodeur/scraper-learner.wiki.git
          git add .
          git diff --staged --quiet || git commit -m "sync: mise à jour depuis le repo principal (${{ github.sha }})"
          git push